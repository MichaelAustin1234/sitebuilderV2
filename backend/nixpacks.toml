[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "nodejs"]

[phases.build]
cmds = [
  "composer install --no-dev --optimize-autoloader"
]

[start]
cmd = "touch database/database.sqlite; php artisan storage:link || true; php artisan migrate:fresh --force --seed || true; php artisan serve --host 0.0.0.0 --port $PORT"
